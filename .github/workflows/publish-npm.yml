name: Publish npm package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    name: Publish freelancer-payment-protection-cli to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3.0.0
        with:
          version: 9
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@11
      - run: pnpm install --frozen-lockfile --filter freelancer-payment-protection-cli...
      - run: pnpm --filter freelancer-payment-protection-cli --if-present run lint
      - run: pnpm --filter freelancer-payment-protection-cli --if-present run typecheck
      - run: pnpm --filter freelancer-payment-protection-cli --if-present run test
      - run: pnpm --filter freelancer-payment-protection-cli --if-present run build
      - name: Syntax check the CLI entry point
        run: node --check packages/cli-npm-wrapper/bin/fpp.js
      - name: Publish to npm
        working-directory: packages/cli-npm-wrapper
        run: npm publish --access public
